name: Збірка й публікація на GitHub Pages

# Проєкт більше не статичний файл у корені: є крок збірки (Vite + TypeScript),
# тому Pages віддає не гілку, а результат цього workflow.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одночасно котиться лише один деплой; зайві черги скасовуються, але вже
# початий не переривається — щоб не лишити сторінку у напівготовому стані.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Тести й перевірка типів — до збірки: краще впасти тут, ніж викотити
      # зламану гру. tsc входить у npm run build, але тести окремо.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
