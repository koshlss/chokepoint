<!doctype html><meta charset="utf-8"><title>clicktest</title>
<body style="background:#0B1116;color:#C8D6DE;font:13px/1.6 ui-monospace,Consolas,monospace;padding:16px">
<pre id="out">…</pre>
<iframe id="f" src="index.html" style="width:900px;height:500px;border:1px solid #333"></iframe>
<script>
/* Тисне на кнопки гри всередині iframe і ловить помилки. Саме цього
   бракувало: завантаження сторінки не перевіряє обробники кліків. */
const log = [], out = () => document.getElementById('out').textContent = log.join('\n');
let bad = 0;
const say = s => { log.push(s); out(); };
const check = (n, ok, extra) => { say((ok ? '  ok   ' : '  ЗБІЙ ') + n + (extra ? '  — ' + extra : '')); if (!ok) bad++; };

/* Стан оновлює hud() з кадру анімації. Під віртуальним часом кадри й
   таймери йдуть не в ногу, тож фіксована пауза давала то проходження,
   то збій на рівному місці. Чекаємо на саму умову, а не на годинник. */
const until = async (fn, ms = 3000) => {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    try { if (fn()) return true; } catch (e) {}
    await new Promise(r => setTimeout(r, 25));
  }
  return false;
};

window.addEventListener('load', async () => {
  const f = document.getElementById('f');
  const w = f.contentWindow, d = f.contentDocument;
  if (!d) { say('немає доступу до iframe (потрібен --allow-file-access-from-files)'); return; }

  const errs = [];
  w.addEventListener('error', e => errs.push(e.message));
  w.addEventListener('unhandledrejection', e => errs.push('promise: ' + (e.reason && e.reason.message || e.reason)));

  await new Promise(r => setTimeout(r, 400));
  say('версія: ' + (w.CHOKEPOINT && w.CHOKEPOINT.BUILD));
  check('гра стартувала', w.CHOKEPOINT && w.CHOKEPOINT.sim && w.CHOKEPOINT.sim.tick >= 0);
  /* Живість циклу міряємо очікуванням умови, а не фіксованою паузою:
     цикл стартує разом із партією, і 400 мс наосліп то встигали, то ні.
     Умова однаково правдива і на кадрах анімації, і на таймері, яким
     цикл їде у фоновій вкладці. */
  check('цикл анімації живий', await until(() => w.CHOKEPOINT.sim.tick > 0),
        'тік ' + w.CHOKEPOINT.sim.tick);

  /* 0. Цілість інтерфейсу мережі. Геттер live одного разу зник під час
        редагування — гра мовчки грала соло, і жодна перевірка цього не
        бачила. Тепер бачить. */
  const n = w.CHOKEPOINT.net;
  check('net.live визначений', typeof n.live === 'boolean', 'зараз ' + typeof n.live);
  check('net.solo визначений', typeof n.solo === 'boolean', 'зараз ' + typeof n.solo);
  for (const m of ['host','join','confirm','reset','send','diag','setState','wire','watch','goLive'])
    check('є метод net.' + m, typeof n[m] === 'function');
  for (const m of ['queue','publishTo','accept','ready','merged'])
    check('є метод Lockstep.' + m, typeof w.CHOKEPOINT.Lockstep.prototype[m] === 'function');
  for (const m of ['step','apply','hash','recomputeFlow','pickTarget','refund','upgradeCost','nextInfo'])
    check('є метод Sim.' + m, typeof w.CHOKEPOINT.Sim.prototype[m] === 'function');

  /* 0в. PeerNet (лобі через посилання) — той самий інтерфейс, що й Net,
        інакше attachNet() тихо зламається на другому транспорті. */
  const PN = w.CHOKEPOINT.PeerNet;
  check('клас PeerNet експортований', typeof PN === 'function');
  if (PN) {
    const pn = new PN();
    check('PeerNet.live визначений', typeof pn.live === 'boolean');
    check('PeerNet.solo визначений', typeof pn.solo === 'boolean');
    for (const m of ['createRoom','joinRoom','bindConn','reset','send','diag','setState','goLive','dispatch'])
      check('є метод PeerNet.' + m, typeof pn[m] === 'function');
  }

  /* 0г. Нові елементи лобі мусять існувати в розмітці. */
  for (const id of ['btnLobbyHost','roomLink','roomLinkText','btnLobbyCopy',
                     'webhookUrl','btnWebhookTest','webhookHint','btnDownloadLog',
                     'veilBtn2','veilReady'])
    check('є елемент #' + id, !!d.getElementById(id));

  /* 0ґ. «Кожен на своїй лінії» — елементи й стан спокою в соло. */
  for (const id of ['duelField','duelToggle','mateBoard','cvMate','mbWave','mbLives','mbGold'])
    check('є елемент #' + id, !!d.getElementById(id));
  check('у соло duelBoards вимкнений', w.CHOKEPOINT.duelBoards === false);
  check('у соло simMate відсутній', w.CHOKEPOINT.simMate === null);
  const duelCb = d.getElementById('duelToggle');
  check('обидва стани гри вдвох мають назву', duelCb.options && duelCb.options.length === 2,
        [...duelCb.options].map(o => o.text).join(' / '));
  check('вибір гри вдвох неактивний у соло (немає з ким)', duelCb.disabled === true || d.getElementById('duelField').className.indexOf('na') >= 0);

  /* 0дд. Підсумок партії: гра розрахована на двох, тож кінець має
          відповідати «хто краще». Внесок — половина від частки вбивств,
          половина від частки шкоди: самих вбивств замало (їх забирає
          вежа біля виходу), самої шкоди теж (добити — окреме вміння). */
  {
    const contrib = w.CHOKEPOINT.contribution;
    check('формула внеску експортована', typeof contrib === 'function');
    if (typeof contrib === 'function') {
      const rівні = contrib([{ kills: 100, dmg: 1000 }, { kills: 100, dmg: 1000 }]);
      check('однаковий внесок дає порівну', Math.abs(rівні[0] - 0.5) < 1e-9 && Math.abs(rівні[1] - 0.5) < 1e-9,
            rівні.map(v => v.toFixed(3)).join(' / '));
      const менше = contrib([{ kills: 150, dmg: 100 }, { kills: 50, dmg: 100 }]);
      check('більше вбивств — більший внесок', менше[0] > менше[1], менше.map(v => v.toFixed(3)).join(' / '));
      const шкода = contrib([{ kills: 100, dmg: 300 }, { kills: 100, dmg: 100 }]);
      check('шкода теж важить, а не лише вбивства', шкода[0] > шкода[1], шкода.map(v => v.toFixed(3)).join(' / '));
      const сума = contrib([{ kills: 7, dmg: 13 }, { kills: 3, dmg: 21 }]);
      check('внески дають рівно одиницю', Math.abs(сума[0] + сума[1] - 1) < 1e-9);
      const нулі = contrib([{ kills: 0, dmg: 0 }, { kills: 0, dmg: 0 }]);
      check('порожня партія не ділить на нуль', Number.isFinite(нулі[0]) && Number.isFinite(нулі[1]));
    }
    /* Формат чисел уже раз зламався мовчки: зворотні скісні в регулярці
       згубились при правці, і роздільники просто зникли, а на вигляд усе
       лишалось «майже так». Тепер перевіряється. */
    const fmt = w.CHOKEPOINT.fmt;
    check('форматувальник чисел експортований', typeof fmt === 'function');
    if (typeof fmt === 'function') {
      const nb = String.fromCharCode(160);
      check('до тисячі — без роздільників', fmt(999) === '999', fmt(999));
      check('розряди відділяються', fmt(1284730) === '1' + nb + '284' + nb + '730', fmt(1284730));
      check('роздільник нерозривний', fmt(1000).indexOf(nb) > 0 && fmt(1000).indexOf(' ') < 0);
      check('до десяти мільйонів не скорочується', fmt(9999999).indexOf('М') < 0, fmt(9999999));
      check('від десяти мільйонів скорочується', fmt(10523491) === '10.52М', fmt(10523491));
      check('нуль лишається нулем', fmt(0) === '0', fmt(0));
    }
    /* Межі половин малювались із map.zones як із масиву, а він таблиця за
       кількістю гравців — цикл не виконувався жодного разу, і гравець не
       бачив, де йому взагалі можна ставити. */
    const ringIdx = w.CHOKEPOINT.MAPS.findIndex(m => m.roads);
    if (ringIdx >= 0) {
      const sim2 = new w.CHOKEPOINT.Sim('ZN', 100, 2, ringIdx, 1);
      check('набір зон береться за кількістю гравців', sim2.zoneSet() && sim2.zoneSet().length === 2,
            sim2.zoneSet() ? sim2.zoneSet().length + ' зон' : 'немає');
      check('удвох кути по діагоналі', sim2.laneOf(0) === 0 && sim2.laneOf(1) === 2,
            sim2.laneOf(0) + ' і ' + sim2.laneOf(1));
      const s4 = new w.CHOKEPOINT.Sim('ZN', 100, 4, ringIdx, 1);
      check('учотирьох задіяні всі кути', [0,1,2,3].every(i => s4.laneOf(i) === i));
      check('учотирьох чверті', s4.zoneSet().length === 4);
    }
    check('є панель підсумку', !!d.getElementById('veilScore'));
    check('є тумблер звуку', !!d.getElementById('sfxToggle'));

    /* Логотип має вести на головну БЕЗ параметрів: із чужого посилання на
       лобі «?room=…» лишається в адресі й тягне назад при кожному
       перезавантаженні — вийти з нього не було чим. */
    const logo = d.getElementById('logoLink');
    check('логотип є посиланням', !!logo && logo.tagName === 'A');
    if (logo) {
      check('логотип веде без параметрів', logo.href.indexOf('?') < 0, logo.getAttribute('href'));
      check('логотип не тягне в лобі', logo.href.indexOf('room') < 0);
      check('логотип не веде в архівну версію', logo.href.indexOf('/v/') < 0);
    }
    /* Перемикач версій з'являється, лише якщо архів опубліковано. На
       dev-сервері архіву немає, тож поле мусить лишатись схованим — і не
       блимати порожнім списком. */
    check('поле версій є в розмітці', !!d.getElementById('verField'));
    check('без архіву поле версій сховане', d.getElementById('verField').hidden === true);
  }

  /* 0д. Панель гравців: у соло її бути НЕ має — рядок на одного лише
         дублював би шапку. Натомість у шапці стоїть особиста стата. */
  for (const id of ['myName','mySwatches','rosterBody','playersTop','rKills','rTowers','rDmg'])
    check('є елемент #' + id, !!d.getElementById(id));
  check('у соло панель гравців схована', await until(() => d.getElementById('playersTop').hidden === true));
  check('у соло панель гравців справді не видно',
        w.getComputedStyle(d.getElementById('playersTop')).display === 'none');
  check('у соло особиста стата стоїть у шапці',
        d.getElementById('rKills').offsetParent !== null);

  /* Панель має з'явитись, щойно партія стає не сольною. */
  n.setState('live');
  check('у коопі панель гравців з\'являється',
        await until(() => d.getElementById('playersTop').hidden === false));
  check('у таблиці гравців є рядки',
        await until(() => d.getElementById('rosterBody').children.length >= 1));
  check('у коопі особиста стата ховається з шапки',
        await until(() => d.getElementById('rKills').offsetParent === null));

  const swatchBtns = d.querySelectorAll('#mySwatches button');
  check('палітра кольорів побудована', swatchBtns.length >= 3, swatchBtns.length + ' кольорів');
  errs.length = 0;
  d.getElementById('myName').value = 'Тест<script>';
  d.getElementById('myName').dispatchEvent(new w.Event('input'));
  if (swatchBtns[1]) swatchBtns[1].click();
  await new Promise(r => setTimeout(r, 150));
  check('нік і колір змінюються без помилок', errs.length === 0, errs.join(' | '));
  check('нік екранується в таблиці (без інʼєкції)', d.getElementById('rosterBody').innerHTML.indexOf('<script>') < 0);
  check('обраний колір позначений aria-pressed', swatchBtns[1] && swatchBtns[1].getAttribute('aria-pressed') === 'true');
  n.setState('off');
  await new Promise(r => setTimeout(r, 150));

  /* 0е. Фракції: гравець бере ОДНУ основну й ОДНУ допоміжну. */
  for (const id of ['primarySel','supportSel','veilFactions'])
    check('є елемент #' + id, !!d.getElementById(id));
  const cards = d.querySelectorAll('.fcard');
  check('картки фракцій побудовані', cards.length === 4, cards.length + ' шт');
  check('картки згруповані за роллю', d.querySelectorAll('.fgroup').length === 2);
  const railKeys = () => [...d.querySelectorAll('#rail .tool')].map(b => b.dataset.key).filter(Boolean);
  const pick = async k => { d.querySelector('.fcard[data-lo="' + k + '"]').click();
                            await new Promise(r => setTimeout(r, 200)); };

  errs.length = 0;
  await pick('steel'); await pick('ice');
  check('вибір фракції не кидає помилок', errs.length === 0, errs.join(' | '));
  const si = railKeys();
  check('арсенал = основна + допоміжна',
        si.indexOf('arrow') >= 0 && si.indexOf('frost') >= 0 &&
        si.indexOf('ember') < 0 && si.indexOf('venom') < 0, si.join(','));
  // картки перемальовуються цілком, тож старе посилання вказує на вилучений вузол
  check('обрані картки позначено',
        d.querySelector('.fcard[data-lo="steel"]').getAttribute('aria-pressed') === 'true' &&
        d.querySelector('.fcard[data-lo="ice"]').getAttribute('aria-pressed') === 'true');

  /* Зміна допоміжної не має чіпати основну — і навпаки. */
  await pick('toxic');
  const st = railKeys();
  check('зміна допоміжної лишає основну на місці',
        st.indexOf('arrow') >= 0 && st.indexOf('venom') >= 0 && st.indexOf('frost') < 0, st.join(','));
  await pick('fire');
  const ft = railKeys();
  check('зміна основної лишає допоміжну на місці',
        ft.indexOf('ember') >= 0 && ft.indexOf('venom') >= 0 && ft.indexOf('arrow') < 0, ft.join(','));

  const locked = [...d.querySelectorAll('#rail .tool.locked')].map(b => b.dataset.key);
  const open   = railKeys().filter(k => locked.indexOf(k) < 0);
  check('на старті відкриті лише базові', locked.length > 0 && open.length > 0,
        'відкрито ' + open.join(',') + ' · закрито ' + locked.join(','));
  check('рівні підписані хвилею відкриття',
        [...d.querySelectorAll('.tierHead')].some(h => h.textContent.indexOf('з хвилі') >= 0));
  check('на нульовій хвилі відкрито лише перший рівень', w.CHOKEPOINT.sim.tier() === 1);
  await pick('steel'); await pick('ice');
  check('вибір повертається назад', railKeys().indexOf('arrow') >= 0);

  /* Радіус — навчальний костур: лише на легкому. Поза ним не має бути ні
     цифри в описі, ні самого тумблера. */
  const diffSel = d.getElementById('diff');
  // саме рядки характеристик башт, а не вся панель: підказки керування
  // можуть містити слово «радіус» самі по собі
  const statText = () => [...d.querySelectorAll('#rail .tool u')].map(n => n.textContent).join(' ');
  const rangeLabel = () => d.getElementById('showRange').closest('label');
  diffSel.value = '70';
  diffSel.dispatchEvent(new w.Event('change'));
  check('на легкому радіус видно', await until(() => statText().indexOf('радіус') >= 0));
  check('на легкому тумблер радіуса є', await until(() => rangeLabel().hidden === false));
  diffSel.value = '100';
  diffSel.dispatchEvent(new w.Event('change'));
  check('на нормі радіуса в описі немає', await until(() => statText().indexOf('радіус') < 0));
  check('на нормі тумблера радіуса немає', await until(() => rangeLabel().hidden === true));
  diffSel.value = '145';
  diffSel.dispatchEvent(new w.Event('change'));
  check('на важкому радіуса теж немає', await until(() => statText().indexOf('радіус') < 0));
  diffSel.value = '100';
  diffSel.dispatchEvent(new w.Event('change'));

  /* Бар'єр на фіксованій трасі не робить нічого (перевірено прогоном:
     375 штук не змінили ні довжину траси, ні жодного життя), тож там його
     не має бути в панелі взагалі. */
  // Режим задаємо явно: за замовчуванням стоїть фіксований шлях, тож
  // покладатись тут на початковий стан означало б перевіряти не бар'єр.
  // І мапу теж: кільцеві грають лише на фіксованому шляху, і на них
  // лабіринт просто не вмикається — перевірявся б не бар'єр, а це.
  const mapSelW = d.getElementById('mapSel');
  const anyMaze = [...mapSelW.options].find(o => !w.CHOKEPOINT.MAPS[+o.value].fixedOnly);
  mapSelW.value = anyMaze.value;
  mapSelW.dispatchEvent(new w.Event('change'));
  await new Promise(r => setTimeout(r, 200));
  const modeSel = d.getElementById('modeSel');
  modeSel.value = '0';
  modeSel.dispatchEvent(new w.Event('change'));
  check('у лабіринті бар\'єр в арсеналі є',
        await until(() => railKeys().indexOf('wall') >= 0), railKeys().join(','));
  modeSel.value = '1';
  modeSel.dispatchEvent(new w.Event('change'));
  check('на фіксованій трасі бар\'єра в арсеналі немає',
        await until(() => railKeys().indexOf('wall') < 0), railKeys().join(','));
  modeSel.value = '0';
  modeSel.dispatchEvent(new w.Event('change'));
  check('назад у лабіринті бар\'єр повертається',
        await until(() => railKeys().indexOf('wall') >= 0), railKeys().join(','));

  /* Зміна фракції в соло — це новий забіг (арсенал фіксований на партію),
     тож гра знову чекає за стартовим екраном. Знімаємо його, інакше далі
     міряли б не живий цикл, а заморожену дошку. */
  const startBtn = d.getElementById('veilBtn');
  if (startBtn && !d.getElementById('veil').hidden) startBtn.click();
  await new Promise(r => setTimeout(r, 300));
  check('стартовий екран знімається кнопкою', await until(() => d.getElementById('veil').hidden === true));
  check('зняття паузи не кидає помилок', errs.length === 0, errs.join(' | '));

  /* 0ж. Підказка по вежі: самих кольорів мало, щоб розрізняти двадцять веж. */
  {
    const cv = d.getElementById('cv'), tip = d.getElementById('towerTip');
    const sim = w.CHOKEPOINT.sim;
    let spot = null;
    for (let y = 0; y < 18 && !spot; y++) for (let x = 0; x < 26; x++)
      if (sim.buildable(x, y)) { spot = { x, y }; break; }
    sim.players[0].gold = 9999;
    const key = [...d.querySelectorAll('#rail .tool')].map(b => b.dataset.key).find(Boolean);
    sim.apply({ t:'build', p:0, seq:0, x:spot.x, y:spot.y, k:key });
    const r = cv.getBoundingClientRect(), cell = r.width / 26;
    const at = (x, y) => cv.dispatchEvent(new w.MouseEvent('mousemove', { bubbles:true,
      clientX: r.left + (x + 0.5) * cell, clientY: r.top + (y + 0.5) * cell }));
    // Підказку збирає кадр, а не сам рух миші: інакше кожен рух коштував
    // запису в DOM і одразу читання розмірів, тобто перерахунку розкладки.
    // Тому чекаємо на умову, а не читаємо одразу після події.
    at(spot.x, spot.y);
    check('підказка по вежі з\'являється', await until(() => tip.hidden === false));
    check('у підказці є назва вежі', tip.textContent.length > 8, tip.textContent.slice(0, 40));
    check('підказка тримається в межах дошки',
          parseFloat(tip.style.left) >= 0 && parseFloat(tip.style.top) >= 0);
    // порожня клітина — підказки бути не має
    let empty = null;
    for (let y = 17; y >= 0 && !empty; y--) for (let x = 25; x >= 0; x--)
      if (sim.buildable(x, y) && !sim.towerAt(x, y)) { empty = { x, y }; break; }
    if (empty) { at(empty.x, empty.y); check('на порожній клітині підказки немає', await until(() => tip.hidden === true)); }
    cv.dispatchEvent(new w.MouseEvent('mouseleave', { bubbles:true }));

    /* 0з. Вибір гілки прокачки. Ставимо вежу, якій є з чого обирати,
           і перевіряємо, що вікно з'являється, а Esc його прибирає. */
    let spot2 = null;
    for (let y = 0; y < 18 && !spot2; y++) for (let x = 0; x < 26; x++)
      if (sim.buildable(x, y) && !sim.towerAt(x, y)) { spot2 = { x, y }; break; }
    sim.players[0].gold = 99999;
    sim.wave = 12;                       // відкриваємо рівні, щоб було що качати
    sim.apply({ t:'build', p:0, seq:1, x:spot2.x, y:spot2.y, k:'lance' });
    const tw = sim.towerAt(spot2.x, spot2.y);
    check('вежа з деревом прокачки поставлена', !!tw);
    if (tw) {
      tw.build = 0;
      check('вежа пропонує дві гілки', sim.upChoices(tw).length === 2,
            sim.upChoices(tw).map(p => p.name).join(' / '));
      d.querySelector('.tool[data-mode="up"]').click();
      cv.dispatchEvent(new w.MouseEvent('mousedown', { button:0, bubbles:true,
        clientX: r.left + (spot2.x + 0.5) * cell, clientY: r.top + (spot2.y + 0.5) * cell }));
      const pick = d.getElementById('upgPick');
      check('вікно вибору гілки з\'являється', await until(() => pick.hidden === false));
      check('у вікні саме дві рівноправні пропозиції',
            d.querySelectorAll('#upgOpts button').length === 2);
      w.dispatchEvent(new w.KeyboardEvent('keydown', { key:'Escape', bubbles:true }));
      check('Esc закриває вікно вибору', await until(() => pick.hidden === true));
      check('скасований вибір нічого не змінив', tw.lvl === 1 && tw.up.length === 0);

      // а тепер справді обираємо — вежа має змінитись саме так, як обіцяно
      const before = { range: tw.st.range, dmg: tw.st.dmg };
      cv.dispatchEvent(new w.MouseEvent('mousedown', { button:0, bubbles:true,
        clientX: r.left + (spot2.x + 0.5) * cell, clientY: r.top + (spot2.y + 0.5) * cell }));
      await until(() => pick.hidden === false);
      d.querySelectorAll('#upgOpts button')[0].click();     // «Довгий ствол»
      check('обрана гілка застосувалась', await until(() => tw.lvl === 2 && tw.up[0] === 'barrel'),
            tw.lvl + ' / ' + tw.up.join(','));
      check('ствол справді додав дальності', tw.st.range > before.range,
            before.range + ' → ' + tw.st.range);
      check('за дальність заплачено шкодою', tw.st.dmg < before.dmg * 2.1,
            before.dmg + ' → ' + tw.st.dmg);
      check('третій рівень пропонує вже інше',
            sim.upChoices(tw).map(p => p.key).join() === 'scope,rapid',
            sim.upChoices(tw).map(p => p.key).join());
    }
  }

  /* 0б. Гість щойно приєднався: номер гравця вже 1, а симуляція ще
         однокористувацька. Саме тут цикл падав на sim.players[1].gold. */
  errs.length = 0;
  n.me = 1; n.setState('waiting');
  await new Promise(r => setTimeout(r, 300));
  const bad0 = (n.evt || []).filter(x => x.indexOf('ПОМИЛКА') >= 0);
  check('цикл живий, поки гість без напарника', errs.length === 0 && bad0.length === 0, (errs.concat(bad0)).join(' | '));
  n.me = 0; n.setState('off');

  // 1. кожен інструмент арсеналу
  const tools = d.querySelectorAll('.tool');
  check('арсенал побудовано', tools.length >= 8, tools.length + ' кнопок');
  check('заблоковані вежі не вибираються кліком',
        [...tools].filter(t => t.classList.contains('locked')).every(t => t.getAttribute('aria-pressed') !== 'true'));
  tools.forEach(t => t.click());

  // 2. керування
  for (const id of ['btnPause','btnSpeed','btnWave','btnVerify','restart']) {
    const b = d.getElementById(id);
    if (b) b.click(); else check('є кнопка ' + id, false);
  }
  await new Promise(r => setTimeout(r, 200));
  check('після керування помилок немає', errs.length === 0, errs.join(' | '));

  // 3. соло: зміна мапи в шапці одразу перезапускає партію новою мапою
  // Крок мусить іти ДО «Створити гру»: щойно піднято лобі, партія вже не
  // соло, і мапу міняє господар у лобі, а не селект у шапці. Раніше цей
  // крок стояв нижче й ловив не ваду гри, а власний порядок.
  errs.length = 0;
  const before = w.CHOKEPOINT.sim.mapIdx;
  const sel = d.getElementById('mapSel');
  sel.value = String((before + 1) % sel.options.length);
  sel.dispatchEvent(new w.Event('change'));
  await new Promise(r => setTimeout(r, 200));
  check('зміна мапи в соло стартує нову партію', errs.length === 0 && w.CHOKEPOINT.sim.mapIdx !== before,
        'було ' + before + ', стало ' + w.CHOKEPOINT.sim.mapIdx);

  // 4. головне — створення гри
  d.getElementById('btnHost').click();
  await new Promise(r => setTimeout(r, 2500));
  const code = d.getElementById('codeBox').value;
  check('«Створити гру» без помилок', errs.length === 0, errs.join(' | '));
  say('  довідково: код запрошення ' + code.length + ' символів (під віртуальним часом ICE не встигає)');

  // 5. вставлення сміття не має валити сторінку
  d.getElementById('codeBox').value = 'не-код';
  d.getElementById('btnUse').click();
  await new Promise(r => setTimeout(r, 300));
  check('сміття в полі коду оброблено чемно', errs.length === 0, errs.join(' | '));

  // 6. кнопки журналу партій безпечні без налаштованого вебхука/історії
  errs.length = 0;
  d.getElementById('btnWebhookTest').click();
  d.getElementById('btnDownloadLog').click();
  await new Promise(r => setTimeout(r, 200));
  check('кнопки журналу партій не падають без даних', errs.length === 0, errs.join(' | '));

  say('');
  say(bad ? '══ ЗБОЇВ: ' + bad + ' ══' : '══ УСЕ ЧИСТО ══');
});
</script>
